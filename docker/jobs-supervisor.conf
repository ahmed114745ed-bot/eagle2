[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:Ach-job-sub]
process_name=%(program_name)s
command=php /app/artisan queue:work --queue=achievement --rest=2
directory=/app
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/app/storage/jobs-logs/acheivment-job.log
stderr_logfile=/app/storage/jobs-logs/acheivment.error



;--------------------------------------------------------------
; OPTIMIZED QUEUE WORKERS CONFIGURATION
; Total: 14 workers
;--------------------------------------------------------------

;--------------------------------------------------------------
; 1. REAL-TIME GIFTS (latency-critical, affects live UX)
;    PK-to-Zego updates, diamond increments
;    Low rest/sleep for instant response
;    2 workers to prevent blocking during gift storms
;--------------------------------------------------------------
[program:gifts-realtime]
command=php /app/artisan queue:work --queue=updatePkAndSendToZigo,increment-diamond --rest=1 --sleep=1 --tries=3 --timeout=30 --max-jobs=500
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 2. PK SYSTEM (PK score updates)
;    Separated for isolation from gift pipeline
;--------------------------------------------------------------
[program:pk-system]
command=php /app/artisan queue:work --queue=pk-job,updatePk --rest=1 --sleep=1 --tries=3 --timeout=30 --max-jobs=500
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 3. ZEGO BROADCASTS (I/O-bound HTTP to Zego API)
;    Gift animations, room broadcasts, room/family level updates
;    Wallet included here for priority processing
;    2 workers to parallelize HTTP wait time
;--------------------------------------------------------------
[program:zego-broadcast]
command=php /app/artisan queue:work --queue=heavy1,wallet,heavy2,heavy3 --rest=2 --sleep=2 --tries=3 --timeout=60 --max-jobs=300
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 4. NOTIFICATIONS (I/O-bound HTTP to Firebase FCM)
;    Push notifications, official messages
;    2 workers — FCM calls block on network I/O
;--------------------------------------------------------------
[program:notifications]
command=php /app/artisan queue:work --queue=notification,notification_heavy,official-message --rest=3 --sleep=3 --tries=3 --timeout=120 --max-jobs=200
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 5. LUCKY BOX (bursty, time-sensitive during events)
;    Box opens, prize distribution
;--------------------------------------------------------------
[program:lucky-box]
command=php /app/artisan queue:work --queue=luckyBox,test-super-lucky-box --rest=3 --sleep=3 --tries=3 --timeout=60 --max-jobs=300
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 6. LUCKY GIFTS (separated from lucky box for parallelism)
;    Lucky gift distribution across 3 queues
;--------------------------------------------------------------
[program:lucky-gift-1]
command=php /app/artisan queue:work --queue=lucky_gift --rest=1 --sleep=1 --tries=3 --timeout=60
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

[program:lucky-gift-2]
command=php /app/artisan queue:work --queue=lucky_gift_2 --rest=1 --sleep=1 --tries=3 --timeout=60
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

[program:lucky-gift-3]
command=php /app/artisan queue:work --queue=lucky_gift_3 --rest=1 --sleep=1 --tries=3 --timeout=60
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10
;--------------------------------------------------------------
; 7. CHARISMA (isolated to avoid blocking other jobs)
;--------------------------------------------------------------
[program:charisma]
command=php /app/artisan queue:work --queue=charisma-job --rest=5 --sleep=3 --tries=3 --timeout=30 --max-jobs=500
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 8. BACKGROUND (low-priority, not time-critical)
;    Logging, follows, achievements, comments, targets, cleanup
;    2 workers to prevent backlog buildup
;--------------------------------------------------------------
[program:background]
command=php /app/artisan queue:work --queue=achievement,sendComment,follow-user-job,log_user_coin,follow_counts,level_rewards,calculate-target,milestones-job,clean_gift_logs --rest=5 --sleep=3 --tries=3 --timeout=90 --max-jobs=500
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 9. DEFAULT (catch-all for jobs without explicit queue)
;    2 workers to handle general workload
;--------------------------------------------------------------
[program:default]
command=php /app/artisan queue:work --queue=default --rest=2 --tries=3 --timeout=90 --max-jobs=500
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

;--------------------------------------------------------------
; QUEUE WORKERS — optimized for e2-highcpu-16 (16 vCPU, 16GB)
; 3 job replicas × 22 workers = 66 total workers
;--------------------------------------------------------------

;--------------------------------------------------------------
; 1. REAL-TIME GIFTS (latency-critical, affects live UX)
;--------------------------------------------------------------
[program:gifts-realtime]
command=php /app/artisan queue:work --queue=updatePkAndSendToZigo,increment-diamond --rest=1 --sleep=1 --tries=3 --timeout=30 --max-jobs=500
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 2. PK SYSTEM
;--------------------------------------------------------------
[program:pk-system]
command=php /app/artisan queue:work --queue=pk-job,updatePk --rest=1 --sleep=1 --tries=3 --timeout=30 --max-jobs=500
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 3. ZEGO BROADCASTS (I/O-bound HTTP to Zego API)
;--------------------------------------------------------------
[program:zego-broadcast]
command=php /app/artisan queue:work --queue=heavy1,wallet,heavy2,heavy3 --rest=2 --sleep=2 --tries=3 --timeout=60 --max-jobs=300
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 4. NOTIFICATIONS (I/O-bound HTTP to Firebase FCM)
;--------------------------------------------------------------
[program:notifications]
command=php /app/artisan queue:work --queue=notification,notification_heavy,official-message --rest=3 --sleep=3 --tries=3 --timeout=120 --max-jobs=200
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 5. LUCKY BOX
;--------------------------------------------------------------
[program:lucky-box]
command=php /app/artisan queue:work --queue=luckyBox,test-super-lucky-box --rest=3 --sleep=3 --tries=3 --timeout=60 --max-jobs=300
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 6. LUCKY GIFTS
;--------------------------------------------------------------
[program:lucky-gift-1]
command=php /app/artisan queue:work --queue=lucky_gift --rest=1 --sleep=1 --tries=3 --timeout=60
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

[program:lucky-gift-2]
command=php /app/artisan queue:work --queue=lucky_gift_2 --rest=1 --sleep=1 --tries=3 --timeout=60
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

[program:lucky-gift-3]
command=php /app/artisan queue:work --queue=lucky_gift_3 --rest=1 --sleep=1 --tries=3 --timeout=60
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 7. CHARISMA
;--------------------------------------------------------------
[program:charisma]
command=php /app/artisan queue:work --queue=charisma-job --rest=5 --sleep=3 --tries=3 --timeout=30 --max-jobs=500
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 7b. CHARISMA REDIS HANDLER
;--------------------------------------------------------------
[program:room-zigo-handler]
command=php /app/artisan app:handling-room-zigo-requests
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 8. BACKGROUND (logging, follows, achievements, etc.)
;    4 workers — log_user_coin has 130K+ backlog
;--------------------------------------------------------------
[program:background]
command=php /app/artisan queue:work --queue=achievement,sendComment,follow-user-job,log_user_coin,follow_counts,level_rewards,calculate-target,milestones-job,clean_gift_logs --rest=3 --sleep=2 --tries=3 --timeout=90 --max-jobs=500
numprocs=4
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

;--------------------------------------------------------------
; 9. DEFAULT (GameWalletJop — 120K+ backlog)
;    4 workers to drain the backlog
;--------------------------------------------------------------
[program:default]
command=php /app/artisan queue:work --queue=default --rest=1 --sleep=1 --tries=3 --timeout=90 --max-jobs=500
numprocs=4
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10

[program:cron]
command=cron -f -L 15
user=root
autostart=true
autorestart=true
stdout_logfile=/app/storage/logs/cron_stdout.log
stderr_logfile=/app/storage/logs/cron_stderr.log

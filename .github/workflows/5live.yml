name: SSh-5live-pipline
on:
  push:
    branches: ["5live"]
jobs:
  run_5live_hub:
    runs-on: ubuntu-latest
    steps:
    - name: print out 5live-hub
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.108.213"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/5live
          pwd
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current%  "
          fi
 
  run_5live_app:
    runs-on:  ubuntu-latest #[self-hosted]
    needs: run_5live_hub
    steps:
    - name: print out 5live-app
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.108.213"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/5live
          pwd
          docker build -t 5live:${{ github.sha }} .
          docker service update --image 5live:${{ github.sha }} 5live-app
          
          # Get first container ID of the service
          CONTAINER_ID=$(docker ps --filter "name=5live-app.1" --format "{{.ID}}" | head -n 1)
          # Run artisan command inside that container
          if [ -n "$CONTAINER_ID" ]; then
            docker exec  $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for 5live-app service"
            exit 1
          fi

          
          # check again
          threshold=75
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
 
  run_5live_job:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_5live_hub
    steps:
    - name: print out 5live-job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.108.213"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: | 
          cd /var/www/5live
          pwd
          docker build -t 5live-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image 5live-job:${{ github.sha }} 5live-job

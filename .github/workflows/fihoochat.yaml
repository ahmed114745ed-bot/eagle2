name: SSh-fihoochat-pipline
on:
  push:
    branches: ["fihoochat"]
concurrency:
  group: fihoochat-deploy
  cancel-in-progress: false

jobs:
  run_fihoochat_hub:
    runs-on: [self-hosted]
    environment: fihoochat-prod
    steps:
    - name: Pull latest code and rotate logs
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.193.220"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/fihoochat
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          mkdir -p storage/jobs-logs
          chmod -R 777 storage/jobs-logs
          test -f public/settings.json || echo '{}' > public/settings.json
          test -f gcp.json || echo '{}' > gcp.json

          LOG_FILE=storage/logs/laravel.log
          if [ -f "$LOG_FILE" ]; then
            LOG_SIZE=$(stat -c%s "$LOG_FILE" 2>/dev/null || echo 0)
            if [ "$LOG_SIZE" -gt 104857600 ]; then
              echo "Rotating laravel.log ($(du -h $LOG_FILE | cut -f1))"
              truncate -s 0 "$LOG_FILE"
            fi
          fi

          find storage/jobs-logs -name '*.log' -size +50M -exec truncate -s 0 {} \; 2>/dev/null

  run_fihoochat_migrate:
    runs-on: [self-hosted]
    needs: run_fihoochat_hub
    environment: fihoochat-prod
    steps:
    - name: Run database migrations once
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.193.220"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/fihoochat
          CONTAINER_ID=$(sudo docker ps --filter "name=fihoochat-octa.1" --format "{{.ID}}" | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            sudo docker exec "$CONTAINER_ID" php /app/artisan migrate --force
          else
            php artisan migrate --force
          fi

  run_fihoochat_app:
    runs-on: [self-hosted]
    needs: run_fihoochat_migrate
    environment: fihoochat-prod
    steps:
    - name: Build and deploy fihoochat Octane
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.193.220"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          set -e
          cd /var/www/fihoochat

          echo "Building fihoochat-octa:${{ github.sha }}..."
          sudo docker build -t fihoochat-octa:${{ github.sha }} . -f Dockerfile-octana
          echo "Build succeeded."

          sudo docker service update \
            --image fihoochat-octa:${{ github.sha }} \
            --replicas 2 \
            --limit-memory 2.5gb \
            --reserve-memory 1.0gb \
            --update-order stop-first \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-failure-action rollback \
            fihoochat-octa

          UPDATE_STATE=$(sudo docker service inspect fihoochat-octa --format '{{.UpdateStatus.State}}')
          if [ "$UPDATE_STATE" = "rollback_completed" ]; then
            echo "ERROR: Service update rolled back!"
            sudo docker service ps fihoochat-octa --no-trunc --format "{{.Name}} {{.CurrentState}} {{.Error}}" | head -10
            exit 1
          fi

          RUNNING_IMAGE=$(sudo docker service inspect fihoochat-octa --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          EXPECTED_IMAGE="fihoochat-octa:${{ github.sha }}"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Image mismatch! Running: $RUNNING_IMAGE, Expected: $EXPECTED_IMAGE"
            exit 1
          fi
          echo "Verified: fihoochat-octa is running $RUNNING_IMAGE"

          sleep 10
          CONTAINER_ID=$(sudo docker ps --filter "name=fihoochat-octa.1" --format "{{.ID}}" | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            sudo docker exec $CONTAINER_ID php artisan whatsapp:change-token || echo "WhatsApp token skipped (non-fatal)"
          else
            echo "No container for token (non-fatal)"
          fi

  run_fihoochat_job:
    runs-on: [self-hosted]
    needs: run_fihoochat_migrate
    environment: fihoochat-prod
    steps:
    - name: Build and deploy fihoochat jobs + cron
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.193.220"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          set -e
          cd /var/www/fihoochat

          echo "Building fihoochat-job:${{ github.sha }}..."
          sudo docker build -t fihoochat-job:${{ github.sha }} -f Dockerfile-jobs .
          echo "Build succeeded."

          sudo docker service update \
            --image fihoochat-job:${{ github.sha }} \
            --replicas 1 \
            --limit-cpu 5.0 \
            --limit-memory 2.5gb \
            --reserve-memory 1.0gb \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-failure-action rollback \
            fihoochat-job

          UPDATE_STATE=$(sudo docker service inspect fihoochat-job --format '{{.UpdateStatus.State}}')
          if [ "$UPDATE_STATE" = "rollback_completed" ]; then
            echo "ERROR: Service update rolled back!"
            sudo docker service ps fihoochat-job --no-trunc --format "{{.Name}} {{.CurrentState}} {{.Error}}" | head -10
            exit 1
          fi

          RUNNING_IMAGE=$(sudo docker service inspect fihoochat-job --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          EXPECTED_IMAGE="fihoochat-job:${{ github.sha }}"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Image mismatch! Running: $RUNNING_IMAGE, Expected: $EXPECTED_IMAGE"
            exit 1
          fi
          echo "Verified: fihoochat-job is running $RUNNING_IMAGE"

          if sudo docker service inspect fihoochat-cron >/dev/null 2>&1; then
            echo "Updating fihoochat-cron service..."
            sudo docker service update \
              --image fihoochat-job:${{ github.sha }} \
              fihoochat-cron
          else
            echo "Creating fihoochat-cron service..."
            sudo docker service create \
              --name fihoochat-cron \
              --init \
              --replicas 1 \
              --limit-memory 512m \
              --reserve-memory 256m \
              --network app-network \
              --mount type=bind,src=/var/www/fihoochat/gcp.json,dst=/app/docker/gcp.json \
              --mount type=bind,src=/var/www/fihoochat/public/settings.json,dst=/app/public/settings.json \
              --mount type=bind,src=/var/www/fihoochat/storage,dst=/app/storage \
              fihoochat-job:${{ github.sha }} \
              php /app/artisan schedule:work
          fi
          echo "Cron service ready."

  run_fihoochat_cleanup:
    runs-on: [self-hosted]
    needs: [run_fihoochat_app, run_fihoochat_job]
    if: always()
    environment: fihoochat-prod
    steps:
    - name: Cleanup old images and build cache
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.193.220"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          CURRENT=${{ github.sha }}
          for img in $(sudo docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'fihoochat-(octa|job):' | grep -v "$CURRENT" | grep -v '<none>'); do
            sudo docker rmi "$img" 2>/dev/null || true
          done
          sudo docker image prune -f 2>/dev/null || true
          sudo docker builder prune -f --filter "until=24h" 2>/dev/null || true
          USAGE=$(df -h / | awk 'NR==2{print $5}')
          echo "Disk usage after cleanup: $USAGE"

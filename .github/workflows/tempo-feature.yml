name: SSh-tempo-feature-pipline
on:
  push:
    branches: ["tempo-feature"]
jobs:
  run_example_job:
    runs-on: ubuntu-latest
    steps:
    - name: print out tempo-feature test
      uses: cross-the-world/ssh-scp-ssh-pipelines@latest
      with:
        host: "34.18.53.132"
        user: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        first_ssh: |
          echo "$USER"
          cd /var/www/tempo
          pwd
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          php artisan migrate
          php artisan optimize:clear

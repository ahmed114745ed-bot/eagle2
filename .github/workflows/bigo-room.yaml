name: SSh-bigo-room-pipline
on:
  push:
    branches: ["bigo-room"]
jobs:
  run_bigo-room_hub:
    runs-on: [self-hosted]
    steps:
    - name: Pull latest code
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.164.14"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/bigo-room
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_bigo-room_octa:
    runs-on: [self-hosted]
    needs: run_bigo-room_hub
    steps:
    - name: Build and deploy Octane
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.164.14"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/bigo-room
          pwd
          docker build -t bigo-room-octa:${{ github.sha }} -f Dockerfile-octana .
          docker service update --image bigo-room-octa:${{ github.sha }} bigo-room-octa

          # Run whatsapp token update
          CONTAINER_ID=$(docker ps --filter "name=bigo-room-octa.1" --format "{{.ID}}" | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            docker exec $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for bigo-room-octa.1 service task"
            exit 1
          fi

          # Disk cleanup check
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_bigo-room_job:
    runs-on: [self-hosted]
    needs: run_bigo-room_hub
    steps:
    - name: Build and deploy Jobs
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.164.14"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/bigo-room
          pwd
          docker build -t bigo-room-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image bigo-room-job:${{ github.sha }} bigo-room-job

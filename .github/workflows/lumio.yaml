name: SSh-lumio-pipline
on:
  push:
    branches: ["lumio"]
concurrency:
  group: lumio-deploy
  cancel-in-progress: false
jobs:
  run_lumio_hub:
    runs-on: [self-hosted]
    steps:
    - name: Pull latest code and rotate logs
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/lumio
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          mkdir -p storage/jobs-logs
          chmod -R 777 storage/jobs-logs
          test -f public/settings.json || echo '{}' > public/settings.json
          test -f gcp.json || echo '{}' > gcp.json

          # Rotate laravel.log if > 100MB
          LOG_FILE=storage/logs/laravel.log
          if [ -f "$LOG_FILE" ]; then
            LOG_SIZE=$(stat -c%s "$LOG_FILE" 2>/dev/null || echo 0)
            if [ "$LOG_SIZE" -gt 104857600 ]; then
              echo "Rotating laravel.log ($(du -h $LOG_FILE | cut -f1))"
              truncate -s 0 "$LOG_FILE"
            fi
          fi

          # Rotate job logs if > 50MB
          find storage/jobs-logs -name '*.log' -size +50M -exec truncate -s 0 {} \; 2>/dev/null

  run_lumio_lint:
    runs-on: [self-hosted]
    needs: run_lumio_hub
    steps:
    - name: PHP syntax check
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        script: |
          cd /var/www/lumio
          echo "=== PHP Syntax Check ==="

          # Run php -l inside a Docker container (no PHP on host)
          sudo docker run --rm -v /var/www/lumio:/app -w /app php:8.2-cli bash -c '
            ERRORS=0

            # Check route files (these cause boot failures)
            for file in routes/web.php routes/api.php routes/channels.php routes/console.php; do
              if [ -f "$file" ]; then
                if ! php -l "$file" 2>&1; then
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            done

            # Check config files
            for file in $(find config/ -name "*.php" -type f 2>/dev/null); do
              if ! php -l "$file" > /dev/null 2>&1; then
                echo "SYNTAX ERROR: $file"
                php -l "$file" 2>&1
                ERRORS=$((ERRORS + 1))
              fi
            done

            # Check app/ PHP files
            while IFS= read -r file; do
              if ! php -l "$file" > /dev/null 2>&1; then
                echo "SYNTAX ERROR: $file"
                php -l "$file" 2>&1
                ERRORS=$((ERRORS + 1))
              fi
            done < <(find app/ -name "*.php" -type f)

            # Check Modules/ PHP files (skip blade templates)
            while IFS= read -r file; do
              if ! php -l "$file" > /dev/null 2>&1; then
                echo "SYNTAX ERROR: $file"
                php -l "$file" 2>&1
                ERRORS=$((ERRORS + 1))
              fi
            done < <(find Modules/ -name "*.php" ! -name "*.blade.php" -type f 2>/dev/null)

            if [ "$ERRORS" -gt 0 ]; then
              echo ""
              echo "FAILED: Found $ERRORS PHP syntax error(s). Fix before deploying."
              exit 1
            fi
            echo "All PHP files passed syntax check."
          '

  run_lumio_migrate:
    runs-on: [self-hosted]
    needs: [run_lumio_hub, run_lumio_lint]
    steps:
    - name: Run database migrations once
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/lumio
          # Run migrations using host code (git-pulled) mounted into a temp container
          # This ensures deleted/modified migrations reflect the latest code
          CONTAINER_ID=$(sudo docker ps --filter "name=lumio-octa.1" --format "{{.ID}}" | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            echo "Syncing migration files from host to container..."
            sudo docker exec "$CONTAINER_ID" rm -rf /app/database/migrations
            sudo docker cp /var/www/lumio/database/migrations "$CONTAINER_ID":/app/database/migrations
            echo "Running migrations in existing octa container..."
            sudo docker exec "$CONTAINER_ID" php /app/artisan migrate --force
          else
            echo "No octa container found, running migrations directly..."
            php artisan migrate --force
          fi

  run_lumio_app:
    runs-on: [self-hosted]
    needs: [run_lumio_hub, run_lumio_lint, run_lumio_migrate]
    steps:
    - name: Build and deploy Lumio Octane
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/lumio
          sudo docker build -t lumio-octa:${{ github.sha }} . -f Dockerfile-octan

          # Retry docker service update up to 3 times (handles Swarm race conditions)
          for attempt in 1 2 3; do
            echo "Attempt $attempt: updating lumio-octa..."
            if sudo docker service update \
              --image lumio-octa:${{ github.sha }} \
              --replicas 3 \
              --limit-memory 2.5gb \
              --reserve-memory 1.0gb \
              --update-order stop-first \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-failure-action rollback \
              lumio-octa; then
              echo "lumio-octa update succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: lumio-octa update failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 15s..."
            sleep 15
          done

          # Verify the running image matches the expected tag
          RUNNING_IMAGE=$(sudo docker service inspect lumio-octa --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          EXPECTED_IMAGE="lumio-octa:${{ github.sha }}"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Image mismatch! Running: $RUNNING_IMAGE, Expected: $EXPECTED_IMAGE"
            exit 1
          fi
          echo "Verified: lumio-octa is running $RUNNING_IMAGE"

          echo "Waiting for container to stabilize..."
          sleep 15

          CONTAINER_ID=$(docker ps --filter "name=lumio-octa.1" --format "{{.ID}}" | head -n 1)

          if [ -n "$CONTAINER_ID" ]; then
            docker exec $CONTAINER_ID php artisan whatsapp:change-token || echo "Warning: Command failed but continuing deployment"
          else
            echo "Error: No running container found for lumio-octa.1"
            exit 1
          fi

  run_lumio_job:
    runs-on: [self-hosted]
    needs: [run_lumio_hub, run_lumio_lint, run_lumio_migrate]
    steps:
    - name: Build and deploy Lumio jobs + cron
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/lumio
          sudo docker build -t lumio-job:${{ github.sha }} -f Dockerfile-jobs .

          # Retry docker service update up to 3 times (handles Swarm race conditions)
          for attempt in 1 2 3; do
            echo "Attempt $attempt: updating lumio-job..."
            if sudo docker service update \
              --image lumio-job:${{ github.sha }} \
              --replicas 1 \
              --limit-cpu 5.0 \
              --limit-memory 2.5gb \
              --reserve-memory 1.0gb \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-failure-action rollback \
              lumio-job; then
              echo "lumio-job update succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: lumio-job update failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 15s..."
            sleep 15
          done

          # Verify the running image matches the expected tag
          RUNNING_IMAGE=$(sudo docker service inspect lumio-job --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          EXPECTED_IMAGE="lumio-job:${{ github.sha }}"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Image mismatch! Running: $RUNNING_IMAGE, Expected: $EXPECTED_IMAGE"
            exit 1
          fi
          echo "Verified: lumio-job is running $RUNNING_IMAGE"

          if sudo docker service inspect lumio-cron >/dev/null 2>&1; then
            echo "Updating lumio-cron service..."
            sudo docker service update \
              --image lumio-job:${{ github.sha }} \
              lumio-cron
          else
            echo "Creating lumio-cron service..."
            sudo docker service create \
              --name lumio-cron \
              --init \
              --replicas 1 \
              --limit-memory 512m \
              --reserve-memory 256m \
              --network app-network \
              --mount type=bind,src=/var/www/lumio/storage,dst=/app/storage \
              lumio-job:${{ github.sha }} \
              php /app/artisan schedule:work
          fi
          echo "Cron service ready."

  run_lumio_cleanup:
    runs-on: [self-hosted]
    needs: [run_lumio_app, run_lumio_job]
    if: always()
    steps:
    - name: Cleanup old images and build cache
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          CURRENT="${{ github.sha }}"

          # Get previous image SHA from Swarm (keep N-1 for rollback safety)
          OCTA_PREV=$(sudo docker service inspect lumio-octa --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null | grep -oE '[a-f0-9]{40}' || echo "")
          JOB_PREV=$(sudo docker service inspect lumio-job --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null | grep -oE '[a-f0-9]{40}' || echo "")
          echo "Keeping: current=$CURRENT octa_prev=$OCTA_PREV job_prev=$JOB_PREV"

          sudo docker container prune -f 2>/dev/null || true

          # Remove legacy charizma-worker service if it exists
          sudo docker service rm lumio-charizma-worker 2>/dev/null || true

          for REPO in lumio-octa lumio-job; do
            sudo docker images "$REPO" --format '{{.Tag}}' | while read TAG; do
              [ "$TAG" = "$CURRENT" ] && continue
              [ -n "$OCTA_PREV" ] && [ "$TAG" = "$OCTA_PREV" ] && continue
              [ -n "$JOB_PREV" ] && [ "$TAG" = "$JOB_PREV" ] && continue
              echo "  Removing $REPO:$TAG"
              sudo docker rmi -f "$REPO:$TAG" 2>/dev/null || true
            done
          done

          sudo docker image prune -f 2>/dev/null || true
          sudo docker builder prune -f --filter "until=24h" 2>/dev/null || true
          echo "Disk: $(df -h / | awk 'NR==2{print $5}')"

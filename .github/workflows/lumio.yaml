name: SSh-lumio-pipline
on:
  push:
    branches: ["lumio"]
jobs:
  run_lumio_hub:
    runs-on: [self-hosted]
    steps:
    - name: Pull latest code
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/lumio
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          mkdir -p storage/jobs-logs
          chmod -R 777 storage/jobs-logs
          test -f public/settings.json || echo '{}' > public/settings.json
          test -f gcp.json || echo '{}' > gcp.json
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space high ($current%), cleaning up..."
            docker system prune -af
          else
            echo "Disk space OK ($current%)"
          fi
  run_lumio_app:
    runs-on: [self-hosted]
    needs: run_lumio_hub
    steps:
    - name: Build and deploy Lumio Octane
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/lumio
          sudo docker build -t lumio-octa:${{ github.sha }} . -f Dockerfile-octan
          sudo docker service update \
            --image lumio-octa:${{ github.sha }} \
            --replicas 2 \
            --limit-memory 2.0gb \
            --reserve-memory 1.0gb \
            --update-order stop-first \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-failure-action rollback \
            lumio-octa

          echo "Waiting for container to stabilize..."
          sleep 15

          CONTAINER_ID=$(docker ps --filter "name=lumio-octa.1" --format "{{.ID}}" | head -n 1)

          if [ -n "$CONTAINER_ID" ]; then
            docker exec $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "Error: No running container found for lumio-octa.1"
            exit 1
          fi

          sudo docker image prune -f 2>/dev/null || true
  run_lumio_job:
    runs-on: [self-hosted]
    needs: run_lumio_hub
    steps:
      - name: Build and deploy Lumio jobs
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: "34.18.61.136"
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.UTDVM }}
          port: ${{ secrets.PORT }}
          command_timeout: 20m
          script: |
            cd /var/www/lumio
            sudo docker build -t lumio-job:${{ github.sha }} -f Dockerfile-jobs .
            
            sudo docker service update \
              --image lumio-job:${{ github.sha }} \
              --replicas 4 \
              --limit-cpu 2.0 \
              --limit-memory 2gb \
              --reserve-memory 1gb \
              --update-parallelism 1 \
              --update-delay 10s \
              lumio-job
              
            sudo docker service update --image lumio-job:${{ github.sha }} lumio-charizma-worker || \
            sudo docker service create \
              --name lumio-charizma-worker \
              --network app-network \
              --replicas 1 \
              --image lumio-job:${{ github.sha }} \
              sh -c "while true; do php /app/artisan app:handling-room-zigo-requests -v; sleep 10; done"

            sudo docker image prune -f 2>/dev/null || true

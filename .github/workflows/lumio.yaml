name: SSh-lumio-pipline
on:
  push:
    branches: ["lumio"]
concurrency:
  group: lumio-deploy
  cancel-in-progress: false
jobs:
  run_lumio_hub:
    runs-on: [self-hosted]
    steps:
    - name: Pull latest code and rotate logs
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/lumio
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          mkdir -p storage/jobs-logs
          chmod -R 777 storage/jobs-logs
          test -f public/settings.json || echo '{}' > public/settings.json
          test -f gcp.json || echo '{}' > gcp.json

          # Rotate laravel.log if > 100MB
          LOG_FILE=storage/logs/laravel.log
          if [ -f "$LOG_FILE" ]; then
            LOG_SIZE=$(stat -c%s "$LOG_FILE" 2>/dev/null || echo 0)
            if [ "$LOG_SIZE" -gt 104857600 ]; then
              echo "Rotating laravel.log ($(du -h $LOG_FILE | cut -f1))"
              truncate -s 0 "$LOG_FILE"
            fi
          fi

          # Rotate job logs if > 50MB
          find storage/jobs-logs -name '*.log' -size +50M -exec truncate -s 0 {} \; 2>/dev/null

  run_lumio_migrate:
    runs-on: [self-hosted]
    needs: run_lumio_hub
    steps:
    - name: Run database migrations once
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/lumio
          CONTAINER_ID=$(sudo docker ps --filter "name=lumio-octa.1" --format "{{.ID}}" | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            echo "Running migrations in existing octa container..."
            sudo docker exec "$CONTAINER_ID" php /app/artisan migrate --force
          else
            echo "No octa container found, running migrations directly..."
            php artisan migrate --force
          fi

  run_lumio_app:
    runs-on: [self-hosted]
    needs: [run_lumio_hub, run_lumio_migrate]
    steps:
    - name: Build and deploy Lumio Octane
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/lumio
          sudo docker build -t lumio-octa:${{ github.sha }} . -f Dockerfile-octan

          # Retry docker service update up to 3 times (handles Swarm race conditions)
          for attempt in 1 2 3; do
            echo "Attempt $attempt: updating lumio-octa..."
            if sudo docker service update \
              --image lumio-octa:${{ github.sha }} \
              --replicas 3 \
              --limit-memory 2.5gb \
              --reserve-memory 1.0gb \
              --update-order stop-first \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-failure-action rollback \
              lumio-octa; then
              echo "lumio-octa update succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: lumio-octa update failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 15s..."
            sleep 15
          done

          # Verify the running image matches the expected tag
          RUNNING_IMAGE=$(sudo docker service inspect lumio-octa --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          EXPECTED_IMAGE="lumio-octa:${{ github.sha }}"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Image mismatch! Running: $RUNNING_IMAGE, Expected: $EXPECTED_IMAGE"
            exit 1
          fi
          echo "Verified: lumio-octa is running $RUNNING_IMAGE"

          echo "Waiting for container to stabilize..."
          sleep 15

          CONTAINER_ID=$(docker ps --filter "name=lumio-octa.1" --format "{{.ID}}" | head -n 1)

          if [ -n "$CONTAINER_ID" ]; then
            docker exec $CONTAINER_ID php artisan whatsapp:change-token || echo "Warning: Command failed but continuing deployment"
          else
            echo "Error: No running container found for lumio-octa.1"
            exit 1
          fi

  run_lumio_job:
    runs-on: [self-hosted]
    needs: [run_lumio_hub, run_lumio_migrate, run_lumio_app]
    steps:
    - name: Build and deploy Lumio jobs
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/lumio
          sudo docker build -t lumio-job:${{ github.sha }} -f Dockerfile-jobs .

          # Retry docker service update up to 3 times (handles Swarm race conditions)
          for attempt in 1 2 3; do
            echo "Attempt $attempt: updating lumio-job..."
            if sudo docker service update \
              --image lumio-job:${{ github.sha }} \
              --replicas 3 \
              --limit-cpu 5.0 \
              --limit-memory 2.5gb \
              --reserve-memory 1.0gb \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-failure-action rollback \
              lumio-job; then
              echo "lumio-job update succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: lumio-job update failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 15s..."
            sleep 15
          done

          # Verify the running image matches the expected tag
          RUNNING_IMAGE=$(sudo docker service inspect lumio-job --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          EXPECTED_IMAGE="lumio-job:${{ github.sha }}"
          if [ "$RUNNING_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Image mismatch! Running: $RUNNING_IMAGE, Expected: $EXPECTED_IMAGE"
            exit 1
          fi
          echo "Verified: lumio-job is running $RUNNING_IMAGE"

          # NOTE: charizma handler (app:handling-room-zigo-requests) runs inside
          # lumio-job containers via supervisord (program:room-zigo-handler in
          # docker/supervisor.conf). No separate Docker service needed.

  run_lumio_cleanup:
    runs-on: [self-hosted]
    needs: [run_lumio_app, run_lumio_job]
    if: always()
    steps:
    - name: Cleanup old images and build cache
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.61.136"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          CURRENT=${{ github.sha }}

          # Remove legacy charizma-worker service if it exists
          # (now handled by supervisord inside lumio-job containers)
          sudo docker service rm lumio-charizma-worker 2>/dev/null || true

          # Remove old tagged images (keep only current)
          for img in $(sudo docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'lumio-(octa|job):' | grep -v "$CURRENT" | grep -v '<none>'); do
            echo "Removing old image: $img"
            sudo docker rmi "$img" 2>/dev/null || true
          done

          # Prune dangling images
          sudo docker image prune -f 2>/dev/null || true

          # Prune build cache older than 24h
          sudo docker builder prune -f --filter "until=24h" 2>/dev/null || true

          # Disk check
          USAGE=$(df -h / | awk 'NR==2{print $5}')
          echo "Disk usage after cleanup: $USAGE"

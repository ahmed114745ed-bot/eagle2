name: SSh-pop-live-pipline
on:
  push:
    branches: ["pop-live"]
jobs:
  run_pop-live_hub:
    runs-on: ubuntu-latest
    steps:
    - name: print out pop-live
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: "34.18.63.120"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 7m
        script: |
          cd /var/www/pop-live
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up  Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_pop-live_app:
    runs-on: [self-hosted] #ubuntu-latest 
    needs: run_pop-live_hub
    steps:
    - name: print out pop-live
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: "34.18.63.120"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/pop-live
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t pop-live:${{ github.sha }} -f Dockerfile-octan .
          docker service update --image pop-live:${{ github.sha }} pop-live-octa

          # Get container ID of task 5live-app.1
          CONTAINER_ID=$(docker ps --filter "name=pop-live-octa.1" --format "{{.ID}}" | head -n 1)

          # Run artisan command inside that container
          if [ -n "$CONTAINER_ID" ]; then
            docker exec  $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for pop-live-octa.1 service task"
            exit 1
          fi

          # check again
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_pop-live_job:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_pop-live_hub
    steps:
    - name: print out pop-live Job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.63.120"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/pop-live
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t pop-live-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image pop-live-job:${{ github.sha }} pop-live-job

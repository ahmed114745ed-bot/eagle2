name: SSh-rixo-chat-pipline
on:
  push:
    branches: ["rixo-chat"]

jobs:
  run_rixo_chat_hub:
    runs-on: [self-hosted]
    environment: rixo-prod
    steps:
    - name: pull latest code and sync env
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/rixo-chat
          sudo git branch --set-upstream-to=origin/rixo-chat rixo-chat || true
          sudo git pull origin rixo-chat

          source /home/${{ secrets.USERNAME }}/scripts/hub.sh || source /home/${{ secrets.USERNAME }}/hub.sh

          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space high ($current%), pruning docker assets..."
            sudo docker system prune -a -f
          fi

  deploy_rixo_stack:
    runs-on: [self-hosted]
    needs: run_rixo_chat_hub
    environment: rixo-prod
    steps:
    - name: build images in parallel and deploy stack
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 30m
        script: |
          cd /var/www/rixo-chat

          sudo docker build -t rixo-chat-octa:${{ github.sha }} -f Dockerfile-octana . &
          PID_OCTA=$!
          sudo docker build -t rixo-chat-job:${{ github.sha }} -f Dockerfile-jobs . &
          PID_JOB=$!

          wait $PID_OCTA
          OCTA_EXIT=$?
          wait $PID_JOB
          JOB_EXIT=$?

          if [ $OCTA_EXIT -ne 0 ] || [ $JOB_EXIT -ne 0 ]; then
            echo "Build failed! octa=$OCTA_EXIT job=$JOB_EXIT"
            exit 1
          fi

          export OCTA_IMAGE=rixo-chat-octa:${{ github.sha }}
          export JOB_IMAGE=rixo-chat-job:${{ github.sha }}

          sudo -E docker stack deploy -c rixo-deployment.yml rixo

  cleanup_images:
    runs-on: [self-hosted]
    needs: deploy_rixo_stack
    if: always()
    environment: rixo-prod
    steps:
    - name: prune dangling images
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          sleep 30
          sudo docker image prune -f

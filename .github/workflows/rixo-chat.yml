name: SSh-rixo-chat-pipline
on:
  push:
    branches: ["rixo-chat"]
concurrency:
  group: rixo-chat-deploy
  cancel-in-progress: false

jobs:
  run_rixo_chat_hub:
    runs-on: [self-hosted]
    environment: rixo-prod
    steps:
    - name: pull latest code and sync env
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/rixo-chat
          sudo git branch --set-upstream-to=origin/rixo-chat rixo-chat || true
          sudo git pull origin rixo-chat

          source /home/${{ secrets.USERNAME }}/scripts/hub.sh || source /home/${{ secrets.USERNAME }}/hub.sh

          sudo docker builder prune -f 2>/dev/null || true
          sudo docker image prune -f 2>/dev/null || true
          echo "Disk space before: $(df -h / | tail -1)"

  deploy_rixo_stack:
    runs-on: [self-hosted]
    needs: run_rixo_chat_hub
    environment: rixo-prod
    steps:
    - name: build images in parallel and deploy stack
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 30m
        script: |
          cd /var/www/rixo-chat

          sudo docker build -t rixo-chat-octa:${{ github.sha }} -f Dockerfile-octana . &
          PID_OCTA=$!
          sudo docker build -t rixo-chat-job:${{ github.sha }} -f Dockerfile-jobs . &
          PID_JOB=$!

          wait $PID_OCTA
          OCTA_EXIT=$?
          wait $PID_JOB
          JOB_EXIT=$?

          if [ $OCTA_EXIT -ne 0 ] || [ $JOB_EXIT -ne 0 ]; then
            echo "Build failed! octa=$OCTA_EXIT job=$JOB_EXIT"
            exit 1
          fi

          export OCTA_IMAGE=rixo-chat-octa:${{ github.sha }}
          export JOB_IMAGE=rixo-chat-job:${{ github.sha }}

          sudo -E docker stack deploy -c rixo-deployment.yml rixo

  cleanup:
    runs-on: [self-hosted]
    needs: deploy_rixo_stack
    if: always()
    environment: rixo-prod
    steps:
    - name: Remove old Docker images
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          CURRENT="${{ github.sha }}"
          for REPO in rixo-chat-octa rixo-chat-job; do
            echo "Cleaning old $REPO images (keeping current: $CURRENT)..."
            sudo docker images "$REPO" --format '{{.Tag}}' | grep -v "$CURRENT" | while read TAG; do
              echo "  Removing $REPO:$TAG"
              sudo docker rmi "$REPO:$TAG" 2>/dev/null || true
            done
          done
          sudo docker image prune -f 2>/dev/null || true
          sudo docker builder prune -f --filter "until=24h" 2>/dev/null || true
          echo "Disk space after cleanup: $(df -h / | tail -1)"

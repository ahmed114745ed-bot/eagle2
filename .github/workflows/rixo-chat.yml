name: SSh-rixo-chat-pipline
on:
  push:
    branches: ["rixo-chat"]

jobs:
  run_rixo_chat_hub:
    runs-on: [self-hosted]
    environment: rixo-prod
    steps:
    - name: pull latest code
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        script: |
          cd /var/www/rixo-chat
          sudo git branch --set-upstream-to=origin/rixo-chat rixo-chat || true
          sudo git pull origin rixo-chat
          
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh || source /home/${{ secrets.USERNAME }}/hub.sh
          
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
            sudo docker system prune -a -f && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi

  run_rixo_chat_app:
    runs-on: [self-hosted]
    needs: run_rixo_chat_hub
    environment: rixo-prod
    steps:
    - name: build and deploy rixo-chat app
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/rixo-chat
          sudo docker build -t rixo-chat-octa:${{ github.sha }} -f Dockerfile-octana .
          sudo docker service update --image rixo-chat-octa:${{ github.sha }} rixo-chat-octa
          
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            sudo docker system prune -a -f
          fi

  run_rixo_chat_job:
    runs-on: [self-hosted]
    needs: run_rixo_chat_hub
    environment: rixo-prod
    steps:
    - name: build and deploy rixo-chat job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.96.67"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/rixo-chat
          sudo docker build -t rixo-chat-job:${{ github.sha }} -f Dockerfile-jobs .
          sudo docker service update --image rixo-chat-job:${{ github.sha }} rixo-chat-job

name: SSh-for-developer-pipline
on:
  push:
    branches: ["for-developer"]
jobs:
  run_for-developer_job:
    runs-on: [self-hosted]
    steps:
    - name: Deploy for-developer
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.18.32"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        script: |
          echo "$USER"
          cd /var/www/for-developer
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          php artisan migrate --force
          php artisan optimize:clear

name: SSh-for-developer-pipline
on:
  push:
    branches: ["for-developer"]
jobs:
  run_for-developer_hub:
    runs-on: [self-hosted]
    steps:
    - name: Pull latest code
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.18.32"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/for-developer
          sudo git fetch origin
          sudo git checkout for-developer || sudo git checkout -b for-developer origin/for-developer
          sudo git reset --hard origin/for-developer
          sudo chmod -R 777 storage
          sudo chown -R www-data:www-data storage
          test -f public/settings.json || echo '{}' > public/settings.json
          test -f gcp.json || echo '{}' > gcp.json
          # Remove broken services from previous failed deploys
          sudo docker service rm for-developer-octa 2>/dev/null || true
          sudo docker service rm for-developer-job 2>/dev/null || true
          # Clean up unused images
          sudo docker image prune -af 2>/dev/null || true
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
            sudo docker system prune -a -f && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_for-developer_app:
    runs-on: [self-hosted]
    needs: run_for-developer_hub
    steps:
    - name: Build and deploy for-developer Octane
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.18.32"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/for-developer
          sudo docker build -t for-developer-octa:${{ github.sha }} -f Dockerfile-octana .
          if sudo docker service ls --format '{{.Name}}' | grep -q '^for-developer-octa$'; then
            sudo docker service update --image for-developer-octa:${{ github.sha }} for-developer-octa
          else
            sudo docker service create \
              --name for-developer-octa \
              --network app-network \
              --replicas 2 \
              --publish 8080:8000 \
              --mount type=bind,source=/var/www/for-developer/storage,target=/app/storage \
              --mount type=bind,source=/var/www/for-developer/public/settings.json,target=/app/public/settings.json \
              --mount type=bind,source=/var/www/for-developer/gcp.json,target=/app/docker/gcp.json \
              --hostname for-developer-octa \
              --limit-memory 2g \
              --stop-grace-period 30s \
              --stop-signal SIGINT \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-failure-action rollback \
              for-developer-octa:${{ github.sha }}
          fi
          # Clean up old unused images
          sudo docker image prune -af 2>/dev/null || true
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
            sudo docker system prune -a -f && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_for-developer_job:
    runs-on: [self-hosted]
    needs: run_for-developer_hub
    steps:
    - name: Build and deploy for-developer jobs
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.18.32"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/for-developer
          sudo docker build -t for-developer-job:${{ github.sha }} -f Dockerfile-jobs .
          if sudo docker service ls --format '{{.Name}}' | grep -q '^for-developer-job$'; then
            sudo docker service update --image for-developer-job:${{ github.sha }} for-developer-job
          else
            sudo docker service create \
              --name for-developer-job \
              --network app-network \
              --replicas 1 \
              --mount type=bind,source=/var/www/for-developer/storage,target=/app/storage \
              --mount type=bind,source=/var/www/for-developer/public/settings.json,target=/app/public/settings.json \
              --mount type=bind,source=/var/www/for-developer/gcp.json,target=/app/docker/gcp.json \
              --hostname for-developer-job \
              --limit-memory 2g \
              --stop-grace-period 30s \
              --stop-signal SIGINT \
              for-developer-job:${{ github.sha }}
          fi
          # Clean up old unused images
          sudo docker image prune -af 2>/dev/null || true

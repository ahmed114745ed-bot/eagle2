name: SSh-dang-pipline
on:
  push:
    branches: ["dang"]
jobs:
  run_dang_hub:
    runs-on: ubuntu-latest
    steps:
    - name: print out dang-hub
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.66.72"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 4m
        script: |
          cd /var/www/dang
          pwd
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
 
  run_dang_app:
    runs-on: ubuntu-latest
    needs: run_dang_hub
    steps:
    - name: print out dang-app
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.66.72"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/dang
          pwd
          docker build -t dang:${{ github.sha }} .
          docker service update --image dang:${{ github.sha }} dang-app
          
          # Get first container ID of the service
          CONTAINER_ID=$(docker ps --filter "name=dang-app.1" --format "{{.ID}}" | head -n 1)
          # Run artisan command inside that container
          if [ -n "$CONTAINER_ID" ]; then
            docker exec  $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for dang-app service"
            exit 1
          fi

          
          # check again
          threshold=75
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
 
  run_dang_job:
    runs-on: ubuntu-latest
    needs: run_dang_hub
    steps:
    - name: print out dang-job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.66.72"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: | 
          cd /var/www/dang
          pwd
          docker build -t dang-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image dang-job:${{ github.sha }} dang-job

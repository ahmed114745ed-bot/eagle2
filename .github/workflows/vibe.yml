name: SSh-vibe-pipline
on:
  push:
    branches: ["vibe"]
jobs:
  run_vibe_hub:
    runs-on: [self-hosted] #ubuntu-latest
    steps:
    - name: print out vibe
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.128.196"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/vibe
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_vibe_app:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_vibe_hub
    steps:
    - name: print out vibe
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.128.196"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/vibe
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t vibe:${{ github.sha }} -f Dockerfile-octan .
          docker service update --image vibe:${{ github.sha }} vibe-octa

          # Get container ID of task 5live-app.1
          CONTAINER_ID=$(docker ps --filter "name=vibe-octa.1" --format "{{.ID}}" | head -n 1)

          # Run artisan command inside that container
          if [ -n "$CONTAINER_ID" ]; then
            docker exec  $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for vibe-octa.1 service task"
            exit 1
          fi

          # check again
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_vibe_job:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_vibe_hub
    steps:
    - name: print out vibe Job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.128.196"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/vibe
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t vibe-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image vibe-job:${{ github.sha }} vibe-job

name: SSh-test-pipline
on:
  push:
    branches: ["test"]
jobs:
  run_example_job:
    runs-on: [self-hosted]
    steps:
    - name: print out Eagle final marge 
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.18.32"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        script: |
          echo "$USER"
          cd /var/www/Eagle
          pwd
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          php artisan migrate
          php artisan optimize:clear

name: SSh-uv-live-pipline
on:
  push:
    branches: ["uv-live"]
jobs:
  run_uv-live_hub:
    runs-on: ubuntu-latest
    steps:
    - name: print out uv-live
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.131.25"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 2m
        script: |
          cd /var/www/uv-live
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_uv-live_app:
    runs-on: ubuntu-latest
    needs: run_uv-live_hub
    steps:
    - name: print out uv-live
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.131.25"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/uv-live
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t uv-live:${{ github.sha }} .
          docker service update --image uv-live:${{ github.sha }} uv-live-app

          # Get container ID of task 5live-app.1
          CONTAINER_ID=$(docker ps --filter "name=uv-live-app.1" --format "{{.ID}}" | head -n 1)

          # Run artisan command inside that container
          if [ -n "$CONTAINER_ID" ]; then
            docker exec  $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for uv-live-app.1 service task"
            exit 1
          fi

          # check again
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_uv-live_job:
    runs-on: ubuntu-latest
    needs: run_uv-live_hub
    steps:
    - name: print out uv-live Job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.131.25"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/uv-live
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t uv-live-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image uv-live-job:${{ github.sha }} uv-live-job

name: SSh-ghala-pipline
on:
  push:
    branches: ["ghala"]
jobs:
  run_ghala_hub:
    runs-on: [self-hosted] #ubuntu-latest
    steps:
    - name: print out ghala
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.70.88"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        script: |
          cd /var/www/ghala
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_ghala_app:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_ghala_hub
    steps:
    - name: print out ghala
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.70.88"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/ghala
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t ghala-octa:${{ github.sha }} -f Dockerfile-octana .
          docker service update --image ghala-octa:${{ github.sha }} ghala-octa

          # Get container ID of task ghala-octa
          CONTAINER_ID=$(docker ps --filter "name=ghala-octa.1" --format "{{.ID}}" | head -n 1)

          # Run artisan command inside that container
          if [ -n "$CONTAINER_ID" ]; then
            docker exec  $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for ghala-octa.1 service task"
            exit 1
          fi

          # check again
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_ghala_job:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_ghala_hub
    steps:
    - name: print out ghala Job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.70.88"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/ghala
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t ghala-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image ghala-job:${{ github.sha }} ghala-job

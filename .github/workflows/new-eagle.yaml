name: SSh-achievmentPackage-pipline
on:
  push:
    branches: ["achievmentPackage"]
jobs:
  run_achievmentPackage_job:
    runs-on: [self-hosted] #ubuntu-latest #[self-hosted]
    steps:
    - name: print out Eagle final marge 
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.18.32"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        script: |
          echo "$USER"
          cd /var/www/achievmentPackage-Eagle
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          composer update --ignore-platform-reqs
          php artisan migrate --force
          php artisan optimize:clear

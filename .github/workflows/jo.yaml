name: Deploy Jo
on:
  push:
    branches: ["jo"]
concurrency:
  group: jo-deploy
  cancel-in-progress: false

jobs:
  hub:
    runs-on: [self-hosted]
    steps:
    - name: Pull code and rotate logs
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/jo
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh || source /home/${{ secrets.USERNAME }}/hub.sh
          mkdir -p storage/jobs-logs
          chmod -R 777 storage/jobs-logs
          test -f public/settings.json || echo '{}' > public/settings.json
          test -f gcp.json || echo '{}' > gcp.json
          LOG_FILE=storage/logs/laravel.log
          if [ -f "$LOG_FILE" ]; then
            LOG_SIZE=$(stat -c%s "$LOG_FILE" 2>/dev/null || echo 0)
            if [ "$LOG_SIZE" -gt 104857600 ]; then
              truncate -s 0 "$LOG_FILE"
            fi
          fi
          find storage/jobs-logs -name '*.log' -size +50M -exec truncate -s 0 {} \; 2>/dev/null
          threshold=60
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            sudo docker system prune -a -f 2>/dev/null
          fi

  migrate:
    runs-on: [self-hosted]
    needs: hub
    steps:
    - name: Run migrations
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          cd /var/www/jo
          CONTAINER_ID=$(sudo docker ps --filter "name=jo-octa.1" --format "{{.ID}}" | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            sudo docker exec "$CONTAINER_ID" php /app/artisan migrate --force || echo "Migration warning (non-fatal)"
          fi

  deploy-app:
    runs-on: [self-hosted]
    needs: [hub, migrate]
    steps:
    - name: Build and deploy app
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/jo
          sudo docker build -t jo:${{ github.sha }} -f Dockerfile-octana .
          for attempt in 1 2 3; do
            echo "Attempt $attempt: updating jo-octa..."
            if sudo docker service update \
              --image jo:${{ github.sha }} \
              --update-order start-first \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-failure-action rollback \
              jo-octa; then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done
          sleep 10
          CONTAINER_ID=$(sudo docker ps --filter "name=jo-octa.1" --format "{{.ID}}" | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            sudo docker exec $CONTAINER_ID php artisan whatsapp:change-token || echo "WhatsApp token skipped (non-fatal)"
          fi

  deploy-job:
    runs-on: [self-hosted]
    needs: [hub, migrate]
    steps:
    - name: Build and deploy job workers
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/jo
          sudo docker build -t jo-job:${{ github.sha }} -f Dockerfile-jobs .
          for attempt in 1 2 3; do
            echo "Attempt $attempt: updating jo-job..."
            if sudo docker service update \
              --image jo-job:${{ github.sha }} \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-failure-action rollback \
              jo-job; then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 15
          done

  cleanup:
    runs-on: [self-hosted]
    needs: [deploy-app, deploy-job]
    if: always()
    steps:
    - name: Cleanup old images and build cache
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 5m
        script: |
          CURRENT="${{ github.sha }}"

          OCTA_PREV=$(sudo docker service inspect jo-octa --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null | grep -oE '[a-f0-9]{40}' || echo "")
          JOB_PREV=$(sudo docker service inspect jo-job --format '{{.PreviousSpec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null | grep -oE '[a-f0-9]{40}' || echo "")
          echo "Keeping: current=$CURRENT octa_prev=$OCTA_PREV job_prev=$JOB_PREV"

          sudo docker container prune -f 2>/dev/null || true

          for REPO in jo jo-job; do
            sudo docker images "$REPO" --format '{{.Tag}}' | while read TAG; do
              [ "$TAG" = "$CURRENT" ] && continue
              [ -n "$OCTA_PREV" ] && [ "$TAG" = "$OCTA_PREV" ] && continue
              [ -n "$JOB_PREV" ] && [ "$TAG" = "$JOB_PREV" ] && continue
              echo "  Removing $REPO:$TAG"
              sudo docker rmi -f "$REPO:$TAG" 2>/dev/null || true
            done
          done

          sudo docker image prune -f 2>/dev/null || true
          sudo docker builder prune --all -f 2>/dev/null || true
          sudo docker system prune -f 2>/dev/null || true
          echo "Disk: $(df -h / | awk 'NR==2{print $5}')"

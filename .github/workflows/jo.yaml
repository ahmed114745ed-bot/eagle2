name: SSh-jo-pipline
on:
  push:
    branches: ["jo"]
jobs:
  run_jo_hub:
    runs-on: ubuntu-latest
    steps:
    - name: print out jo
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 3m
        script: |
          cd /var/www/jo
          source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_jo_app:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_jo_hub
    steps:
    - name: print out jo
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/jo
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t jo:${{ github.sha }} -f Dockerfile-octan .
          docker service update --image jo:${{ github.sha }} jo-octa

          # Get container ID of task 5live-app.1
          CONTAINER_ID=$(docker ps --filter "name=jo-octa.1" --format "{{.ID}}" | head -n 1)

          # Run artisan command inside that container
          if [ -n "$CONTAINER_ID" ]; then
            docker exec  $CONTAINER_ID php artisan whatsapp:change-token
          else
            echo "No running container found for jo-app.1 service task"
            exit 1
          fi

          # check again
          threshold=80
          current=$(df -h | awk '$NF=="/"{printf "%d", $5}' | sed 's/%//')
          if [ $current -gt $threshold ]; then
            echo "Disk space is more than $threshold% utilized"
          # Execute the command to clean up Docker system
            docker system prune -a -f && docker system prune --all --force && echo "Docker system cleaned successfully"
          else
            echo "Disk space is within acceptable limits $current% "
          fi
  run_jo_job:
    runs-on: [self-hosted] #ubuntu-latest
    needs: run_jo_hub
    steps:
    - name: print out jo Job
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: "34.18.156.128"
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.UTDVM }}
        port: ${{ secrets.PORT }}
        command_timeout: 20m
        script: |
          cd /var/www/jo
          pwd
          #source /home/${{ secrets.USERNAME }}/scripts/hub.sh
          docker build -t jo-job:${{ github.sha }} -f Dockerfile-jobs .
          docker service update --image jo-job:${{ github.sha }} jo-job
